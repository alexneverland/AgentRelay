<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your AgentRelay account</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f4f7f6;
      color: #173b34;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    "
  >
    <table
      role="presentation"
      style="
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #dce8e3;
        border-radius: 12px;
      "
    >
      <tr>
        <td style="padding: 28px">
          <p style="margin: 0 0 20px; font-size: 16px; font-weight: bold">AgentRelay</p>
          <h1 style="font-size: 24px; line-height: 1.3">Confirm your email address</h1>
          <p>You requested an AgentRelay account. Confirm your email address to continue.</p>
          <p style="margin: 28px 0">
            <a
              href="{{ .ConfirmationURL }}"
              style="
                display: inline-block;
                padding: 12px 20px;
                border-radius: 6px;
                background: #087f73;
                color: #ffffff;
                text-decoration: none;
                font-weight: bold;
              "
              >Confirm email address</a
            >
          </p>
          <p>Community access is reviewed separately after email confirmation.</p>
          <p style="color: #526860; font-size: 14px">
            If you did not request this account, you can ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
